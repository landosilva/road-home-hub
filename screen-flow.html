<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Home — Screen Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared-nav.css">
<style>
  :root {
    --bg: #F4F2ED;
    --dot: #D8D5CD;
    --card: #FFFFFF;
    --surface: #F9F7F3;
    --text: #2C2A25;
    --muted: #6B6862;
    --faint: #A09D96;
    --border: #E4E1DA;
    --accent: #D4582A;
    --accent-soft: rgba(212,88,42,0.08);
    --teal: #1A8F6E;
    --teal-soft: rgba(26,143,110,0.08);
    --purple: #7C6BC4;
    --purple-soft: rgba(124,107,196,0.08);
    --amber: #B8780F;
    --amber-soft: rgba(184,120,15,0.08);
    --blue: #3B7DD8;
    --blue-soft: rgba(59,125,216,0.08);
    --font: 'Outfit', system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: #fff; }

  /* === CONNECTION LINES === */
  .connections {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    overflow: visible;
    z-index: 3;
  }
  .conn-line {
    stroke: var(--border);
    stroke-width: 2;
    fill: none;
  }
  .conn-arrow { fill: var(--faint); }

  /* ========== CANVAS MODE ========== */
  .canvas-wrap {
    width: 100%;
    height: calc(100% - 48px);
    margin-top: 48px;
    overflow: hidden;
    position: relative;
    cursor: crosshair;
  }
  .canvas-wrap.dragging { cursor: grabbing; }
  .canvas-wrap.selecting { cursor: crosshair; }
  .canvas-wrap.panning { cursor: grab; }
  .canvas-wrap.panning.dragging { cursor: grabbing; }

  /* Selection rectangle */
  .selection-rect {
    position: fixed;
    border: 1.5px solid var(--accent);
    background: rgba(212,88,42,0.08);
    pointer-events: none;
    z-index: 90;
    border-radius: 2px;
    display: none;
  }
  .screen.multi-selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(212,88,42,0.3), 0 4px 16px rgba(0,0,0,0.08);
  }
  .canvas {
    position: absolute;
    transform-origin: 0 0;
    will-change: transform;
  }
  .canvas-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
    background-size: 24px 24px;
    z-index: 0;
    pointer-events: none;
  }

  /* Screen cards */
  .screen {
    position: absolute;
    width: 340px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    transition: box-shadow 0.2s, border-color 0.2s;
    z-index: 1;
    cursor: pointer;
  }
  .screen:hover {
    box-shadow: 0 12px 40px rgba(0,0,0,0.1);
    border-color: var(--accent);
    z-index: 2;
  }
  .screen.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft), 0 12px 40px rgba(0,0,0,0.1);
    z-index: 2;
  }
  .screen.dragging-screen {
    opacity: 0.9;
    z-index: 10;
    cursor: grabbing;
  }
  .screen-img {
    width: 100%;
    aspect-ratio: 16/9;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    position: relative;
  }
  .screen-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    -webkit-user-drag: none;
    user-select: none;
    pointer-events: none;
  }
  .screen-img .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
    color: var(--faint);
  }
  .placeholder-icon { font-size: 2.5rem; opacity: 0.4; }
  .placeholder-text { font-size: 0.7rem; font-weight: 300; font-style: italic; }
  .screen-body { padding: 0.6rem 0.9rem 0.7rem; }
  .screen-num {
    font-family: var(--mono);
    font-size: 0.5rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.1rem;
  }
  .screen-title {
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 0.15rem;
  }
  .screen-desc {
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.5;
  }
  /* Edit icon on screen card */
  .screen-edit-btn {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    width: 28px; height: 28px;
    border: 1px solid rgba(0,0,0,0.1);
    background: rgba(255,255,255,0.9);
    color: var(--muted);
    border-radius: 6px;
    font-size: 0.75rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 5;
    transition: all 0.15s;
  }
  .screen:hover .screen-edit-btn { display: flex; }
  .screen-edit-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }


  /* Draft actions */
  .draft-actions {
    position: fixed;
    top: 58px;
    right: 1rem;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    z-index: 150;
  }
  .draft-discard {
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--font);
    font-size: 0.72rem;
    font-weight: 400;
    padding: 0.4rem 0.7rem;
    transition: all 0.15s;
    color: var(--muted);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .draft-discard:hover { color: var(--accent); border-color: var(--accent); }
  .draft-save { color: var(--teal); border-color: var(--teal); font-weight: 500; }
  .draft-save:hover { color: var(--card); background: var(--teal); }

  /* History panel */
  .history-panel {
    position: fixed;
    top: 58px;
    right: 1rem;
    width: 320px;
    max-height: 400px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    z-index: 200;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .history-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .history-panel-header h3 { font-size: 0.85rem; font-weight: 600; }
  .history-list {
    overflow-y: auto;
    flex: 1;
    padding: 0.5rem;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    font-size: 0.75rem;
    transition: background 0.15s;
  }
  .history-item:hover { background: var(--surface); }
  .history-item-date { color: var(--muted); font-weight: 400; }
  .history-item-screens { color: var(--faint); font-size: 0.65rem; }
  .history-item-actions { display: flex; gap: 0.35rem; }
  .history-item-actions button {
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font);
    font-size: 0.65rem;
    padding: 0.25rem 0.5rem;
    transition: all 0.15s;
    color: var(--muted);
  }
  .history-item-actions button:hover { color: var(--accent); border-color: var(--accent); }
  .history-empty {
    padding: 2rem 1rem;
    text-align: center;
    color: var(--faint);
    font-size: 0.8rem;
    font-weight: 300;
  }

  /* Toolbar */
  .toolbar {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.4rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    z-index: 100;
  }
  .toolbar button {
    width: 36px; height: 36px;
    border: none; background: transparent;
    border-radius: 8px; cursor: pointer;
    font-size: 1rem; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .toolbar button:hover { background: var(--surface); color: var(--text); }
  .zoom-display {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--faint);
    min-width: 3.5rem;
    text-align: center;
    font-weight: 500;
  }
  .toolbar .sep { width:1px; height:20px; background:var(--border); margin:0 0.15rem; }
  .play-btn {
    background: var(--accent) !important;
    color: #fff !important;
    border-radius: 8px !important;
    font-size: 0.75rem !important;
    font-weight: 600 !important;
    width: auto !important;
    padding: 0 1rem !important;
    letter-spacing: 0.02em;
  }
  .play-btn:hover { background: #c04e22 !important; }
  /* Context menu */
  .ctx-menu {
    position: fixed;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.3rem;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    z-index: 300;
    min-width: 160px;
    display: none;
  }
  .ctx-menu.open { display: block; }
  .ctx-menu button {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
    padding: 0.5rem 0.75rem;
    border: none;
    background: transparent;
    border-radius: 7px;
    font-family: var(--font);
    font-size: 0.8rem;
    color: var(--text);
    cursor: pointer;
    transition: background 0.1s;
  }
  .ctx-menu button:hover { background: var(--surface); }

  /* ========== PLAY MODE ========== */
  .play-overlay {
    position: fixed;
    inset: 0;
    background: #0e0d0b;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .play-overlay.active { display: flex; }

  .play-screen {
    display: none;
    position: relative;
    width: 100%;
    max-width: calc(100vh * 16 / 9);
    aspect-ratio: 16/9;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 0 80px rgba(0,0,0,0.6);
  }
  .play-screen.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* The image fills the 16:9 frame */
  .play-bg {
    position: absolute;
    inset: 0;
    background: #181614;
    overflow: hidden;
  }
  .play-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .play-bg .play-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    color: #444;
    background: linear-gradient(135deg, #1a1917 0%, #222 50%, #1a1917 100%);
  }
  .play-placeholder-icon { font-size: 5rem; opacity: 0.3; }
  .play-placeholder-text { font-size: 1rem; font-weight: 300; letter-spacing: 0.05em; }

  /* Overlay gradient for readability of bottom controls */
  .play-screen::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 180px;
    background: linear-gradient(to top, rgba(14,13,11,0.85) 0%, transparent 100%);
    pointer-events: none;
    z-index: 1;
  }

  /* Screen label (bottom left, inside frame) */
  .play-label {
    position: absolute;
    bottom: 1.25rem;
    left: 1.5rem;
    z-index: 2;
  }
  .play-label-num {
    font-family: var(--mono);
    font-size: 0.55rem;
    font-weight: 500;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 0.15rem;
  }
  .play-label-title {
    font-size: 1.5rem;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .play-label-desc {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.5);
    font-weight: 300;
    margin-top: 0.2rem;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  /* Navigation (bottom right, inside frame) */
  .play-nav {
    position: absolute;
    bottom: 1.25rem;
    right: 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0.4rem;
    z-index: 2;
  }
  .play-nav button {
    padding: 0.55rem 1.3rem;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.75);
    border-radius: 10px;
    font-family: var(--font);
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    backdrop-filter: blur(12px);
  }
  .play-nav button:hover {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border-color: rgba(255,255,255,0.3);
  }
  .play-nav .nav-next {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .play-nav .nav-next:hover { background: #c04e22; }
  .play-nav .nav-teal {
    background: rgba(26,143,110,0.25);
    border-color: var(--teal);
    color: rgba(255,255,255,0.85);
  }
  .play-nav .nav-teal:hover { background: rgba(26,143,110,0.4); color: #fff; }

  /* Generic popup (map, etc.) */
  .screen-popup {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 10;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    align-items: center;
    justify-content: center;
  }
  .screen-popup.active { display: flex; }
  .screen-popup-inner {
    position: relative;
    width: 80%;
    max-width: 700px;
    background: #1a1917;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    flex-direction: column;
    gap: 0.5rem;
  }
  .screen-popup-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .screen-popup-close {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    width: 32px; height: 32px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.4);
    color: rgba(255,255,255,0.6);
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .screen-popup-close:hover { background: rgba(0,0,0,0.6); color: #fff; }

  /* Close button (top right, inside screen) */
  .play-close {
    position: absolute;
    top: 1.25rem;
    right: 1.25rem;
    z-index: 3;
    width: 38px; height: 38px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.3);
    color: rgba(255,255,255,0.6);
    border-radius: 10px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    backdrop-filter: blur(12px);
  }
  .play-close:hover { background: rgba(0,0,0,0.5); color: #fff; }

  /* Main menu button (top left, inside frame) */
  .play-menu-btn {
    position: absolute;
    top: 1rem;
    left: 1rem;
    z-index: 3;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.3);
    color: rgba(255,255,255,0.6);
    border-radius: 10px;
    font-family: var(--font);
    font-size: 0.72rem;
    font-weight: 400;
    padding: 0.5rem 0.9rem;
    cursor: pointer;
    display: flex; align-items: center; gap: 0.35rem;
    transition: all 0.15s;
    backdrop-filter: blur(12px);
  }
  .play-menu-btn:hover { background: rgba(0,0,0,0.5); color: #fff; }

  /* Progress dots (fixed, centered below frame) */
  .play-dots {
    position: fixed;
    bottom: calc((100vh - min(100vw * 9/16, 100vh)) / 2 + 1.25rem);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.4rem;
    z-index: 210;
  }
  .play-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: all 0.2s;
    cursor: pointer;
  }
  .play-dot.active { background: var(--accent); transform: scale(1.4); }
  .play-dot:hover { background: rgba(255,255,255,0.5); }

  /* ========== EDIT PANEL ========== */
  .edit-panel {
    position: fixed;
    top: 48px;
    right: -400px;
    width: 380px;
    bottom: 0;
    background: var(--card);
    border-left: 1px solid var(--border);
    z-index: 150;
    overflow-y: auto;
    transition: right 0.25s ease;
    box-shadow: -4px 0 20px rgba(0,0,0,0.05);
  }
  .edit-panel.open { right: 0; }
  .edit-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--card);
    z-index: 1;
  }
  .edit-panel-header h3 {
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .edit-panel-close {
    width: 28px; height: 28px;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .edit-panel-close:hover { background: var(--surface); color: var(--text); }
  .edit-section {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  .edit-section-label {
    font-size: 0.6rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--faint);
    margin-bottom: 0.6rem;
  }
  .edit-field { margin-bottom: 0.7rem; }
  .edit-field:last-child { margin-bottom: 0; }
  .edit-field label {
    display: block;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 0.25rem;
  }
  .edit-field input,
  .edit-field textarea,
  .edit-field select {
    width: 100%;
    padding: 0.45rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    font-family: var(--font);
    font-size: 0.8rem;
    color: var(--text);
    transition: border-color 0.15s;
  }
  .edit-field input:focus,
  .edit-field textarea:focus,
  .edit-field select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .edit-field textarea { resize: vertical; min-height: 50px; }
  .edit-conn-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-bottom: 0.4rem;
    font-size: 0.75rem;
  }
  .edit-conn-row select {
    flex: 1;
    padding: 0.35rem 0.4rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    font-family: var(--font);
    font-size: 0.75rem;
    color: var(--text);
  }
  .edit-conn-row input {
    flex: 1;
    padding: 0.35rem 0.4rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    font-family: var(--font);
    font-size: 0.75rem;
    color: var(--text);
  }
  .edit-conn-remove {
    width: 24px; height: 24px;
    border: none;
    background: transparent;
    color: var(--faint);
    cursor: pointer;
    border-radius: 4px;
    font-size: 0.7rem;
    display: flex; align-items: center; justify-content: center;
  }
  .edit-conn-remove:hover { background: rgba(212,88,42,0.1); color: var(--accent); }
  .edit-add-btn {
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 6px;
    padding: 0.35rem 0.6rem;
    font-family: var(--font);
    font-size: 0.7rem;
    cursor: pointer;
    width: 100%;
    transition: all 0.15s;
    margin-top: 0.3rem;
  }
  .edit-add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .edit-delete-btn {
    width: 100%;
    padding: 0.6rem;
    border: 1px solid rgba(212,88,42,0.3);
    background: rgba(212,88,42,0.05);
    color: var(--accent);
    border-radius: 8px;
    font-family: var(--font);
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .edit-delete-btn:hover { background: rgba(212,88,42,0.12); }
  .edit-popup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem;
    margin-bottom: 0.4rem;
  }
  .edit-popup-card .edit-field { margin-bottom: 0.5rem; }
</style>
</head>
<body>

<script src="screen-flow-data.js"></script>
<script>
// ========== DATA LAYER ==========
// Source of truth: screen-flow-data.json (committed to repo, deployed to everyone)
// localStorage is a draft buffer for local edits before saving back to the file.
const STORAGE_KEY = 'roadhome-screenflow-draft';
let project = null;
let hasDraft = false;

function saveProject(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  hasDraft = true;
  updateDraftIndicator();
}

function discardDraft() {
  localStorage.removeItem(STORAGE_KEY);
  hasDraft = false;
  updateDraftIndicator();
}

function updateDraftIndicator() {
  const el = document.getElementById('draftActions');
  if (el) el.style.display = hasDraft ? 'flex' : 'none';
}


function initProject() {
  // 1. Check for a local draft first
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && data.version && data.screens) {
        project = data;
        hasDraft = true;
        return;
      }
    }
  } catch(e) {}

  // 2. Load from the committed JS file (window.__screenFlowData)
  if (window.__screenFlowData) {
    project = JSON.parse(JSON.stringify(window.__screenFlowData)); // deep clone
    return;
  }

  // 3. Fallback: empty project
  project = { version: 1, screens: [], canvasConnections: [] };
}

// ========== RENDERING ==========
const canvasEl = document.getElementById('canvas');
const connSvg = document.getElementById('connSvg');
const overlayEl = document.getElementById('playOverlay');
const dotsEl = document.getElementById('playDots');

let selectedScreenId = null;

function renderCanvas() {
  // Remove existing screen cards (keep SVG)
  canvasEl.querySelectorAll('.screen').forEach(el => el.remove());

  project.screens.forEach(screen => {
    const div = document.createElement('div');
    div.className = 'screen';
    div.id = screen.id;
    div.style.left = screen.x + 'px';
    div.style.top = screen.y + 'px';
    if (screen.id === selectedScreenId) div.classList.add('selected');

    const imgHTML = screen.image
      ? `<img src="${screen.image}" alt="${screen.title}">`
      : `<div class="placeholder"><div class="placeholder-icon">🖼</div><div class="placeholder-text">No image</div></div>`;

    div.innerHTML = `
      <div class="screen-img">${imgHTML}</div>
      <div class="screen-body">
        <div class="screen-num" style="color:${screen.color}">Screen ${String(screen.num).padStart(2,'0')}</div>
        <div class="screen-title">${screen.title}</div>
        <div class="screen-desc">${screen.subtitle}</div>
      </div>
      <button class="screen-edit-btn" data-id="${screen.id}">✎</button>
    `;

    // Edit button
    div.querySelector('.screen-edit-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      selectScreen(screen.id);
      openEditPanel(screen.id);
    });

    // Click to play
    div.addEventListener('click', (e) => {
      if (div.classList.contains('dragging-screen')) return;
      const idx = project.screens.findIndex(s => s.id === screen.id);
      overlayEl.classList.add('active');
      goTo(idx);
    });

    // Drag to reposition
    setupScreenDrag(div, screen);

    canvasEl.appendChild(div);
  });

  drawConns();
}

function setupScreenDrag(div, screen) {
  let dragStartX, dragStartY, origX, origY, hasMoved;

  div.addEventListener('mousedown', (e) => {
    if (e.target.closest('.screen-edit-btn')) return;
    // If multi-selected and this screen is in the selection, let multi-drag handle it
    if (multiSelected.has(screen.id) && multiSelected.size > 1) return;
    e.stopPropagation();
    clearMultiSelect();
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    origX = screen.x;
    origY = screen.y;
    hasMoved = false;

    const onMove = (e2) => {
      const dx = (e2.clientX - dragStartX) / scale;
      const dy = (e2.clientY - dragStartY) / scale;
      if (!hasMoved && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
      hasMoved = true;
      div.classList.add('dragging-screen');
      screen.x = Math.round(origX + dx);
      screen.y = Math.round(origY + dy);
      div.style.left = screen.x + 'px';
      div.style.top = screen.y + 'px';
      drawConns();
    };

    const onUp = () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      if (hasMoved) {
        saveProject(project);
        // Small delay to prevent click from firing
        setTimeout(() => div.classList.remove('dragging-screen'), 50);
      }
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });
}

function renderPlayMode() {
  // Remove existing play screens
  overlayEl.querySelectorAll('.play-screen').forEach(el => el.remove());
  dotsEl.innerHTML = '';

  project.screens.forEach((screen, idx) => {
    const div = document.createElement('div');
    div.className = 'play-screen';
    div.dataset.idx = idx;

    // Background
    const bgHTML = screen.image
      ? `<img src="${screen.image}" alt="">`
      : `<div class="play-placeholder"><div class="play-placeholder-icon">🖼</div><div class="play-placeholder-text">${screen.title}</div></div>`;

    let html = `<div class="play-bg">${bgHTML}</div>`;

    // Menu button
    if (screen.showMenuBtn) {
      const menuIdx = project.screens.findIndex(s => s.id === 's2');
      html += `<button class="play-menu-btn" data-goto="${menuIdx >= 0 ? menuIdx : 1}">☰ Main Menu</button>`;
    }

    // Label
    html += `
      <div class="play-label">
        <div class="play-label-num">Screen ${String(screen.num).padStart(2,'0')}</div>
        <div class="play-label-title">${screen.title}</div>
        <div class="play-label-desc">${screen.playDesc || screen.subtitle}</div>
      </div>
    `;

    // Navigation buttons
    html += '<div class="play-nav">';
    screen.connections.forEach(conn => {
      const styleClass = conn.style === 'next' ? 'nav-next' : conn.style === 'teal' ? 'nav-teal' : '';
      if (conn.popup) {
        html += `<button class="${styleClass}" data-popup="${conn.popup}">${conn.label}</button>`;
      } else if (conn.target) {
        const targetIdx = project.screens.findIndex(s => s.id === conn.target);
        html += `<button class="${styleClass}" data-goto="${targetIdx}">${conn.label}</button>`;
      }
    });
    html += '</div>';

    // Popups
    screen.popups.forEach(popup => {
      html += `
        <div class="screen-popup" data-popup-id="${popup.id}">
          <div class="screen-popup-inner" style="aspect-ratio:${popup.aspectRatio || '4/3'}">
            <button class="screen-popup-close">✕</button>
            ${popup.image ? `<img src="${popup.image}" alt="${popup.title}">` : `<div style="padding:2rem;color:#666">${popup.title}</div>`}
          </div>
        </div>
      `;
    });

    div.innerHTML = html;
    overlayEl.appendChild(div);

    // Wire button events
    div.querySelectorAll('[data-goto]').forEach(btn => {
      btn.addEventListener('click', () => goTo(parseInt(btn.dataset.goto)));
    });
    div.querySelectorAll('[data-popup]').forEach(btn => {
      btn.addEventListener('click', () => {
        const popupEl = div.querySelector(`[data-popup-id="${btn.dataset.popup}"]`);
        if (popupEl) popupEl.classList.add('active');
      });
    });
    div.querySelectorAll('.screen-popup-close').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.closest('.screen-popup').classList.remove('active');
      });
    });

    // Dot
    const dot = document.createElement('div');
    dot.className = 'play-dot';
    dot.addEventListener('click', () => goTo(idx));
    dotsEl.appendChild(dot);
  });
}

// ========== CONNECTION ARROWS ==========
function getEdgePoint(el, targetEl) {
  const sx = parseInt(el.style.left), sy = parseInt(el.style.top);
  const sw = el.offsetWidth, sh = el.offsetHeight;
  const cx = sx + sw/2, cy = sy + sh/2;
  const tx = parseInt(targetEl.style.left) + targetEl.offsetWidth/2;
  const ty = parseInt(targetEl.style.top) + targetEl.offsetHeight/2;
  const dx = tx - cx, dy = ty - cy;
  if (Math.abs(dx) / sw > Math.abs(dy) / sh) {
    return dx > 0 ? {x: sx + sw, y: cy} : {x: sx, y: cy};
  } else {
    return dy > 0 ? {x: cx, y: sy + sh} : {x: cx, y: sy};
  }
}

function drawConns() {
  requestAnimationFrame(() => {
    let defs = '<defs><marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon class="conn-arrow" points="0 0, 10 3.5, 0 7"/></marker></defs>';
    let lines = '<g class="conn-lines">';
    let tips = '<g class="conn-tips">';
    project.canvasConnections.forEach(({from: fid, to: tid}) => {
      const fromEl = document.getElementById(fid);
      const toEl = document.getElementById(tid);
      if (!fromEl || !toEl) return;

      const a = getEdgePoint(fromEl, toEl);
      const b = getEdgePoint(toEl, fromEl);
      const dx = b.x - a.x, dy = b.y - a.y;
      const aExitsHoriz = (a.y !== parseInt(fromEl.style.top) && a.y !== parseInt(fromEl.style.top) + fromEl.offsetHeight);
      const bExitsHoriz = (b.y !== parseInt(toEl.style.top) && b.y !== parseInt(toEl.style.top) + toEl.offsetHeight);
      let cx1, cy1, cx2, cy2;
      const dist = Math.max(Math.abs(dx), Math.abs(dy)) * 0.5;
      if (aExitsHoriz) {
        cx1 = a.x + Math.sign(dx || 1) * dist; cy1 = a.y;
      } else {
        cx1 = a.x; cy1 = a.y + Math.sign(dy || 1) * dist;
      }
      if (bExitsHoriz) {
        cx2 = b.x - Math.sign(dx || 1) * dist; cy2 = b.y;
      } else {
        cx2 = b.x; cy2 = b.y - Math.sign(dy || 1) * dist;
      }
      const d = 'M'+a.x+','+a.y+' C'+cx1+','+cy1+' '+cx2+','+cy2+' '+b.x+','+b.y;
      lines += '<path class="conn-line" d="'+d+'"/>';
      tips += '<path class="conn-line" d="'+d+'" marker-end="url(#ah)" style="stroke:none"/>';
    });
    lines += '</g>';
    tips += '</g>';
    connSvg.innerHTML = defs + lines + tips;
  });
}

// ========== EDIT PANEL ==========
const editPanel = document.getElementById('editPanel');
const editPanelContent = document.getElementById('editPanelContent');

function selectScreen(id) {
  selectedScreenId = id;
  canvasEl.querySelectorAll('.screen').forEach(s => s.classList.toggle('selected', s.id === id));
}

function openEditPanel(screenId) {
  const screen = project.screens.find(s => s.id === screenId);
  if (!screen) return;

  document.getElementById('editPanelTitle').textContent = `Edit: ${screen.title}`;

  const colorOptions = [
    { val: 'var(--accent)', label: 'Red' },
    { val: 'var(--teal)', label: 'Teal' },
    { val: 'var(--purple)', label: 'Purple' },
    { val: 'var(--amber)', label: 'Amber' },
    { val: 'var(--blue)', label: 'Blue' }
  ];

  const styleOptions = [
    { val: 'next', label: 'Primary (accent)' },
    { val: 'default', label: 'Default' },
    { val: 'teal', label: 'Teal' }
  ];

  const screenOptions = project.screens.map(s => `<option value="${s.id}" ${s.id === screenId ? 'disabled' : ''}>${s.title}</option>`).join('');

  let html = '';

  // Basic info
  html += `<div class="edit-section">
    <div class="edit-section-label">Content</div>
    <div class="edit-field">
      <label>Title</label>
      <input type="text" id="editTitle" value="${screen.title}">
    </div>
    <div class="edit-field">
      <label>Subtitle (canvas)</label>
      <textarea id="editSubtitle">${screen.subtitle}</textarea>
    </div>
    <div class="edit-field">
      <label>Play description</label>
      <textarea id="editPlayDesc">${screen.playDesc || ''}</textarea>
    </div>
    <div class="edit-field">
      <label>Image path</label>
      <input type="text" id="editImage" value="${screen.image || ''}" placeholder="images/filename.png">
    </div>
    <div class="edit-field">
      <label>Screen number</label>
      <input type="number" id="editNum" value="${screen.num}" min="1" style="width:80px">
    </div>
    <div class="edit-field">
      <label>Color</label>
      <select id="editColor">${colorOptions.map(c => `<option value="${c.val}" ${screen.color === c.val ? 'selected' : ''}>${c.label}</option>`).join('')}</select>
    </div>
    <div class="edit-field">
      <label><input type="checkbox" id="editMenuBtn" ${screen.showMenuBtn ? 'checked' : ''}> Show Main Menu button</label>
    </div>
  </div>`;

  // Canvas connections
  html += `<div class="edit-section">
    <div class="edit-section-label">Canvas Arrows</div>
    <div id="editCanvasConns">`;
  const outgoing = project.canvasConnections.filter(c => c.from === screenId);
  outgoing.forEach((conn, i) => {
    html += `<div class="edit-conn-row">
      <span style="color:var(--faint);font-size:0.7rem">→</span>
      <select data-canvas-conn="${i}">${screenOptions.replace(`value="${conn.to}"`, `value="${conn.to}" selected`)}</select>
      <button class="edit-conn-remove" data-remove-canvas="${i}">✕</button>
    </div>`;
  });
  html += `</div>
    <button class="edit-add-btn" id="addCanvasConn">+ Add arrow</button>
  </div>`;

  // Play connections
  html += `<div class="edit-section">
    <div class="edit-section-label">Play Mode Buttons</div>
    <div id="editPlayConns">`;
  screen.connections.forEach((conn, i) => {
    const popupOptions = screen.popups.map(p => `<option value="${p.id}" ${conn.popup === p.id ? 'selected' : ''}>${p.title}</option>`).join('');
    html += `<div class="edit-conn-row" style="flex-wrap:wrap;gap:0.3rem">
      <input type="text" value="${conn.label}" data-conn-label="${i}" style="flex:1;min-width:100px" placeholder="Label">
      <select data-conn-style="${i}" style="width:100px">${styleOptions.map(s => `<option value="${s.val}" ${conn.style === s.val ? 'selected' : ''}>${s.label}</option>`).join('')}</select>
      <select data-conn-target="${i}" style="flex:1;min-width:100px">
        <option value="">— None —</option>
        ${screenOptions.replace(conn.target ? `value="${conn.target}"` : 'NOMATCH', conn.target ? `value="${conn.target}" selected` : 'NOMATCH')}
      </select>
      <select data-conn-popup="${i}" style="width:100px">
        <option value="">No popup</option>
        ${popupOptions}
      </select>
      <button class="edit-conn-remove" data-remove-conn="${i}">✕</button>
    </div>`;
  });
  html += `</div>
    <button class="edit-add-btn" id="addPlayConn">+ Add button</button>
  </div>`;

  // Popups
  html += `<div class="edit-section">
    <div class="edit-section-label">Popups</div>
    <div id="editPopups">`;
  screen.popups.forEach((popup, i) => {
    html += `<div class="edit-popup-card">
      <div class="edit-field">
        <label>Title</label>
        <input type="text" value="${popup.title}" data-popup-title="${i}">
      </div>
      <div class="edit-field">
        <label>Image</label>
        <input type="text" value="${popup.image || ''}" data-popup-image="${i}" placeholder="images/filename.png">
      </div>
      <div class="edit-field">
        <label>Aspect ratio</label>
        <input type="text" value="${popup.aspectRatio || '4/3'}" data-popup-ratio="${i}" placeholder="4/3" style="width:80px">
      </div>
      <button class="edit-conn-remove" data-remove-popup="${i}" style="width:100%;text-align:center;height:auto;padding:0.25rem">Remove popup</button>
    </div>`;
  });
  html += `</div>
    <button class="edit-add-btn" id="addPopup">+ Add popup</button>
  </div>`;

  // Delete
  html += `<div class="edit-section">
    <button class="edit-delete-btn" id="deleteScreen">Delete this screen</button>
  </div>`;

  editPanelContent.innerHTML = html;
  editPanel.classList.add('open');

  // Wire up change handlers
  const save = () => { saveProject(project); renderCanvas(); renderPlayMode(); };

  document.getElementById('editTitle').addEventListener('input', (e) => { screen.title = e.target.value; document.getElementById('editPanelTitle').textContent = `Edit: ${screen.title}`; });
  document.getElementById('editSubtitle').addEventListener('input', (e) => { screen.subtitle = e.target.value; });
  document.getElementById('editPlayDesc').addEventListener('input', (e) => { screen.playDesc = e.target.value; });
  document.getElementById('editImage').addEventListener('input', (e) => { screen.image = e.target.value; });
  document.getElementById('editNum').addEventListener('input', (e) => { screen.num = parseInt(e.target.value) || 1; });
  document.getElementById('editColor').addEventListener('change', (e) => { screen.color = e.target.value; });
  document.getElementById('editMenuBtn').addEventListener('change', (e) => { screen.showMenuBtn = e.target.checked; });

  // Debounced save on any input
  let saveTimer;
  editPanelContent.addEventListener('input', () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); });
  editPanelContent.addEventListener('change', () => { clearTimeout(saveTimer); save(); });

  // Canvas connection changes
  editPanelContent.querySelectorAll('[data-canvas-conn]').forEach(sel => {
    sel.addEventListener('change', () => {
      const i = parseInt(sel.dataset.canvasConn);
      const outgoing = project.canvasConnections.filter(c => c.from === screenId);
      if (outgoing[i]) outgoing[i].to = sel.value;
      save();
    });
  });
  editPanelContent.querySelectorAll('[data-remove-canvas]').forEach(btn => {
    btn.addEventListener('click', () => {
      const outgoing = project.canvasConnections.filter(c => c.from === screenId);
      const i = parseInt(btn.dataset.removeCanvas);
      const conn = outgoing[i];
      project.canvasConnections = project.canvasConnections.filter(c => c !== conn);
      save(); openEditPanel(screenId);
    });
  });
  document.getElementById('addCanvasConn').addEventListener('click', () => {
    const firstOther = project.screens.find(s => s.id !== screenId);
    if (firstOther) {
      project.canvasConnections.push({ from: screenId, to: firstOther.id });
      save(); openEditPanel(screenId);
    }
  });

  // Play connection changes
  editPanelContent.querySelectorAll('[data-conn-label]').forEach(inp => {
    inp.addEventListener('input', () => { screen.connections[parseInt(inp.dataset.connLabel)].label = inp.value; });
  });
  editPanelContent.querySelectorAll('[data-conn-style]').forEach(sel => {
    sel.addEventListener('change', () => { screen.connections[parseInt(sel.dataset.connStyle)].style = sel.value; });
  });
  editPanelContent.querySelectorAll('[data-conn-target]').forEach(sel => {
    sel.addEventListener('change', () => { screen.connections[parseInt(sel.dataset.connTarget)].target = sel.value || null; });
  });
  editPanelContent.querySelectorAll('[data-conn-popup]').forEach(sel => {
    sel.addEventListener('change', () => { screen.connections[parseInt(sel.dataset.connPopup)].popup = sel.value || null; });
  });
  editPanelContent.querySelectorAll('[data-remove-conn]').forEach(btn => {
    btn.addEventListener('click', () => {
      screen.connections.splice(parseInt(btn.dataset.removeConn), 1);
      save(); openEditPanel(screenId);
    });
  });
  document.getElementById('addPlayConn').addEventListener('click', () => {
    const newId = 'c' + screen.id.replace('s','') + '-' + (screen.connections.length + 1);
    screen.connections.push({ id: newId, label: 'Button →', target: null, style: 'default', popup: null });
    save(); openEditPanel(screenId);
  });

  // Popup changes
  editPanelContent.querySelectorAll('[data-popup-title]').forEach(inp => {
    inp.addEventListener('input', () => { screen.popups[parseInt(inp.dataset.popupTitle)].title = inp.value; });
  });
  editPanelContent.querySelectorAll('[data-popup-image]').forEach(inp => {
    inp.addEventListener('input', () => { screen.popups[parseInt(inp.dataset.popupImage)].image = inp.value; });
  });
  editPanelContent.querySelectorAll('[data-popup-ratio]').forEach(inp => {
    inp.addEventListener('input', () => { screen.popups[parseInt(inp.dataset.popupRatio)].aspectRatio = inp.value; });
  });
  editPanelContent.querySelectorAll('[data-remove-popup]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.removePopup);
      const popupId = screen.popups[i].id;
      screen.popups.splice(i, 1);
      // Remove references from connections
      screen.connections.forEach(c => { if (c.popup === popupId) c.popup = null; });
      save(); openEditPanel(screenId);
    });
  });
  document.getElementById('addPopup').addEventListener('click', () => {
    const newId = 'popup-' + Date.now();
    screen.popups.push({ id: newId, title: 'New popup', image: '', aspectRatio: '4/3' });
    save(); openEditPanel(screenId);
  });

  // Delete screen
  document.getElementById('deleteScreen').addEventListener('click', () => {
    if (!confirm(`Delete "${screen.title}"? This will also remove all connections to/from it.`)) return;
    project.screens = project.screens.filter(s => s.id !== screenId);
    project.canvasConnections = project.canvasConnections.filter(c => c.from !== screenId && c.to !== screenId);
    // Remove play connections targeting this screen
    project.screens.forEach(s => {
      s.connections = s.connections.filter(c => c.target !== screenId);
    });
    closeEditPanel();
    save();
  });
}

function closeEditPanel() {
  editPanel.classList.remove('open');
  selectedScreenId = null;
  canvasEl.querySelectorAll('.screen').forEach(s => s.classList.remove('selected'));
}

document.getElementById('editPanelClose').addEventListener('click', closeEditPanel);

// ========== CANVAS PAN/ZOOM ==========
const wrap = document.getElementById('canvasWrap');
const canvas = document.getElementById('canvas');
const zoomDisplay = document.getElementById('zoomDisplay');

let scale = 1;
let panX = 0;
let panY = 0;
let isDragging = false;
let startX, startY;
let spaceHeld = false;
let multiSelected = new Set();

const selectionRect = document.getElementById('selectionRect');

function applyTransform() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  zoomDisplay.textContent = Math.round(scale * 100) + '%';
}

// Track space key for pan mode
window.addEventListener('keydown', (e) => { if (e.code === 'Space' && !e.repeat) { spaceHeld = true; wrap.classList.add('panning'); } });
window.addEventListener('keyup', (e) => { if (e.code === 'Space') { spaceHeld = false; wrap.classList.remove('panning'); } });

wrap.addEventListener('mousedown', (e) => {
  // Middle-click or space+click = pan
  if (e.button === 1 || (e.button === 0 && spaceHeld)) {
    e.preventDefault();
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    wrap.classList.add('dragging');
    return;
  }
  // Left-click on empty canvas = selection rectangle
  if (e.button === 0) {
    const selStartX = e.clientX;
    const selStartY = e.clientY;
    let hasMoved = false;

    const onMove = (e2) => {
      const dx = e2.clientX - selStartX;
      const dy = e2.clientY - selStartY;
      if (!hasMoved && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
      hasMoved = true;
      wrap.classList.add('selecting');
      selectionRect.style.display = 'block';
      selectionRect.style.left = Math.min(selStartX, e2.clientX) + 'px';
      selectionRect.style.top = Math.min(selStartY, e2.clientY) + 'px';
      selectionRect.style.width = Math.abs(dx) + 'px';
      selectionRect.style.height = Math.abs(dy) + 'px';

      // Live highlight screens that intersect the selection rect
      const selRect = selectionRect.getBoundingClientRect();
      canvasEl.querySelectorAll('.screen').forEach(el => {
        const sr = el.getBoundingClientRect();
        const intersects = !(sr.right < selRect.left || sr.left > selRect.right ||
                            sr.bottom < selRect.top || sr.top > selRect.bottom);
        el.classList.toggle('multi-selected', intersects);
      });
    };

    const onUp = (e2) => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      selectionRect.style.display = 'none';
      wrap.classList.remove('selecting');

      if (hasMoved) {
        // Collect selected screen ids
        multiSelected = new Set();
        canvasEl.querySelectorAll('.screen.multi-selected').forEach(el => {
          multiSelected.add(el.id);
        });
        if (multiSelected.size > 0) {
          setupMultiDrag();
        }
      } else {
        // Click on empty space = deselect all
        clearMultiSelect();
        closeEditPanel();
      }
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  }
});
// Pan via middle-click or space+drag
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  panX = e.clientX - startX;
  panY = e.clientY - startY;
  applyTransform();
});
window.addEventListener('mouseup', (e) => {
  if (!isDragging) return;
  isDragging = false;
  wrap.classList.remove('dragging');
});

function clearMultiSelect() {
  multiSelected.clear();
  canvasEl.querySelectorAll('.screen.multi-selected').forEach(el => el.classList.remove('multi-selected'));
}

function setupMultiDrag() {
  // Allow dragging the group: listen for mousedown on any multi-selected screen
  canvasEl.querySelectorAll('.screen.multi-selected').forEach(el => {
    const handler = (e) => {
      if (e.target.closest('.screen-edit-btn')) return;
      if (!multiSelected.has(el.id)) return;
      e.stopPropagation();
      const dragStartX = e.clientX;
      const dragStartY = e.clientY;
      // Snapshot original positions of all selected screens
      const origPositions = {};
      multiSelected.forEach(id => {
        const s = project.screens.find(s => s.id === id);
        if (s) origPositions[id] = { x: s.x, y: s.y };
      });
      let hasMoved = false;

      const onMove = (e2) => {
        const dx = (e2.clientX - dragStartX) / scale;
        const dy = (e2.clientY - dragStartY) / scale;
        if (!hasMoved && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
        hasMoved = true;
        multiSelected.forEach(id => {
          const s = project.screens.find(s => s.id === id);
          const div = document.getElementById(id);
          if (s && div && origPositions[id]) {
            s.x = Math.round(origPositions[id].x + dx);
            s.y = Math.round(origPositions[id].y + dy);
            div.style.left = s.x + 'px';
            div.style.top = s.y + 'px';
          }
        });
        drawConns();
      };

      const onUp = () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        if (hasMoved) saveProject(project);
      };

      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    };

    // Store the handler so we can potentially clean up later
    el._multiDragHandler = handler;
    el.addEventListener('mousedown', handler);
  });
}

wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const prev = scale;
  const factor = e.deltaY > 0 ? 0.95 : 1.05;
  scale = Math.min(Math.max(scale * factor, 0.2), 2.5);
  panX = mx - (mx - panX) * (scale / prev);
  panY = my - (my - panY) * (scale / prev);
  applyTransform();
}, { passive: false });

// Touch
let lastDist = 0;
wrap.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    isDragging = true;
    startX = e.touches[0].clientX - panX;
    startY = e.touches[0].clientY - panY;
  } else if (e.touches.length === 2) {
    isDragging = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastDist = Math.sqrt(dx*dx + dy*dy);
  }
}, { passive: false });
wrap.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    panX = e.touches[0].clientX - startX;
    panY = e.touches[0].clientY - startY;
    applyTransform();
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const prev = scale;
    scale = Math.min(Math.max(scale * (dist / lastDist), 0.2), 2.5);
    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    panX = mx - (mx - panX) * (scale / prev);
    panY = my - (my - panY) * (scale / prev);
    lastDist = dist;
    applyTransform();
  }
}, { passive: false });
wrap.addEventListener('touchend', () => { isDragging = false; });

// Toolbar
document.getElementById('zoomIn').addEventListener('click', () => {
  const cx = wrap.clientWidth/2, cy = wrap.clientHeight/2;
  const prev = scale;
  scale = Math.min(scale * 1.2, 2.5);
  panX = cx - (cx - panX) * (scale / prev);
  panY = cy - (cy - panY) * (scale / prev);
  applyTransform();
});
document.getElementById('zoomOut').addEventListener('click', () => {
  const cx = wrap.clientWidth/2, cy = wrap.clientHeight/2;
  const prev = scale;
  scale = Math.max(scale * 0.8, 0.2);
  panX = cx - (cx - panX) * (scale / prev);
  panY = cy - (cy - panY) * (scale / prev);
  applyTransform();
});
function fitAll() {
  const screens = document.querySelectorAll('.screen');
  let minX=Infinity, minY=Infinity, maxX=0, maxY=0;
  screens.forEach(s => {
    const l = parseInt(s.style.left), t = parseInt(s.style.top);
    minX = Math.min(minX, l); minY = Math.min(minY, t);
    maxX = Math.max(maxX, l + s.offsetWidth); maxY = Math.max(maxY, t + s.offsetHeight);
  });
  const w = maxX - minX + 100, h = maxY - minY + 100;
  scale = Math.min(wrap.clientWidth / w, wrap.clientHeight / h, 1) * 0.85;
  panX = (wrap.clientWidth - w * scale) / 2 - minX * scale + 50 * scale;
  panY = (wrap.clientHeight - h * scale) / 2 - minY * scale + 50 * scale;
  applyTransform();
}
document.getElementById('resetView').addEventListener('click', fitAll);
document.getElementById('fitAll').addEventListener('click', fitAll);

function focusScreen(id) {
  const s = document.getElementById(id);
  if (!s) return;
  const sl = parseInt(s.style.left), st = parseInt(s.style.top);
  const sw = 340, sh = 300;
  scale = 1.2;
  panX = (wrap.clientWidth / 2) - (sl + sw / 2) * scale;
  panY = (wrap.clientHeight / 2) - (st + sh / 2) * scale;
  applyTransform();
}

// ========== CONTEXT MENU ==========
const ctxMenu = document.getElementById('ctxMenu');
let ctxCanvasX = 0, ctxCanvasY = 0;

wrap.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  ctxCanvasX = (e.clientX - rect.left - panX) / scale;
  ctxCanvasY = (e.clientY - rect.top - panY) / scale;
  ctxMenu.style.left = e.clientX + 'px';
  ctxMenu.style.top = e.clientY + 'px';
  ctxMenu.classList.add('open');
});

document.addEventListener('click', () => ctxMenu.classList.remove('open'));
document.addEventListener('contextmenu', (e) => {
  if (!wrap.contains(e.target)) ctxMenu.classList.remove('open');
});

document.getElementById('ctxAddScreen').addEventListener('click', () => {
  const maxNum = Math.max(0, ...project.screens.map(s => s.num));
  const newId = 's' + (maxNum + 1);

  const newScreen = {
    id: newId,
    num: maxNum + 1,
    title: 'New screen',
    subtitle: 'Description goes here.',
    playDesc: '',
    image: '',
    color: 'var(--accent)',
    x: Math.round(ctxCanvasX - 170),
    y: Math.round(ctxCanvasY - 150),
    showMenuBtn: false,
    connections: [],
    popups: []
  };

  project.screens.push(newScreen);
  saveProject(project);
  renderCanvas();
  renderPlayMode();
  selectScreen(newId);
  openEditPanel(newId);
});

// ========== PLAY MODE ==========
let playIdx = 0;

function goTo(idx) {
  const playScreens = overlayEl.querySelectorAll('.play-screen');
  const totalScreens = playScreens.length;
  playIdx = Math.max(0, Math.min(idx, totalScreens - 1));
  playScreens.forEach(s => s.classList.remove('active'));
  playScreens[playIdx].classList.add('active');
  dotsEl.querySelectorAll('.play-dot').forEach((d, i) => {
    d.classList.toggle('active', i === playIdx);
  });
}

document.getElementById('playBtn').addEventListener('click', () => {
  overlayEl.classList.add('active');
  goTo(0);
});
document.getElementById('playClose').addEventListener('click', () => {
  overlayEl.classList.remove('active');
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (!overlayEl.classList.contains('active')) {
    if (e.key === 'Escape') closeEditPanel();
    if (e.key === 'Delete' && selectedScreenId) {
      document.getElementById('deleteScreen')?.click();
    }
    return;
  }
  if (e.key === 'Escape') overlayEl.classList.remove('active');
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goTo(playIdx + 1); }
});

// ========== HISTORY ==========
const HISTORY_KEY = 'roadhome-screenflow-history';
const MAX_HISTORY = 20;

function getHistory() {
  try {
    return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
  } catch(e) { return []; }
}

function pushHistory(data, label) {
  const history = getHistory();
  history.unshift({
    timestamp: new Date().toISOString(),
    label: label || 'Save',
    screenCount: data.screens?.length || 0,
    data: JSON.parse(JSON.stringify(data))
  });
  if (history.length > MAX_HISTORY) history.length = MAX_HISTORY;
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function renderHistory() {
  const list = document.getElementById('historyList');
  const history = getHistory();
  if (!history.length) {
    list.innerHTML = '<div class="history-empty">No saved versions yet.</div>';
    return;
  }
  list.innerHTML = history.map((entry, i) => {
    const d = new Date(entry.timestamp);
    const date = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    return `<div class="history-item">
      <div>
        <div class="history-item-date">${date}</div>
        <div class="history-item-screens">${entry.screenCount} screens · ${entry.label}</div>
      </div>
      <div class="history-item-actions">
        <button data-idx="${i}" class="history-restore">Restore</button>
        <button data-idx="${i}" class="history-download">↓</button>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.history-restore').forEach(btn => {
    btn.addEventListener('click', () => {
      const entry = history[parseInt(btn.dataset.idx)];
      if (!confirm('Restore this version? Current draft will be replaced.')) return;
      project = JSON.parse(JSON.stringify(entry.data));
      saveProject(project);
      renderCanvas();
      renderPlayMode();
      document.getElementById('historyPanel').style.display = 'none';
    });
  });

  list.querySelectorAll('.history-download').forEach(btn => {
    btn.addEventListener('click', () => {
      const entry = history[parseInt(btn.dataset.idx)];
      downloadAsFile(entry.data);
    });
  });
}

function downloadAsFile(data) {
  const jsContent = '// Source of truth for screen flow data.\n'
    + '// Edit via the dashboard (Save button) or directly here.\n'
    + '// Commit and deploy to update the live version.\n'
    + 'window.__screenFlowData = ' + JSON.stringify(data, null, 2) + ';\n';
  const blob = new Blob([jsContent], { type: 'application/javascript' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'screen-flow-data.js';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ========== INIT ==========
function boot() {
  renderCanvas();
  renderPlayMode();
  focusScreen(project.screens[0]?.id || 's1');
  updateDraftIndicator();

  // Save: snapshot history + download file
  document.getElementById('saveDraft').addEventListener('click', () => {
    pushHistory(project, 'Manual save');
    downloadAsFile(project);
    // Clear draft since we're "saving" to file
    discardDraft();
    renderHistory();
  });

  // History toggle
  const historyPanel = document.getElementById('historyPanel');
  document.getElementById('historyBtn').addEventListener('click', () => {
    const showing = historyPanel.style.display !== 'none';
    historyPanel.style.display = showing ? 'none' : 'flex';
    if (!showing) renderHistory();
  });
  document.getElementById('historyClose').addEventListener('click', () => {
    historyPanel.style.display = 'none';
  });

  // Reset
  document.getElementById('discardDraft').addEventListener('click', () => {
    if (!confirm('Reset to original data? Local edits will be lost.')) return;
    discardDraft();
    location.reload();
  });
}

window.addEventListener('resize', drawConns);
initProject();
boot();
</script>

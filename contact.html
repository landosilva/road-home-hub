<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Home — Contact</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared-nav.css">
<style>
  :root {
    --bg: #F9F7F3;
    --card: #FFFFFF;
    --surface: #F1EFE9;
    --text: #2C2A25;
    --muted: #6B6862;
    --faint: #A09D96;
    --border: #E4E1DA;
    --accent: #D4582A;
    --accent-soft: rgba(212,88,42,0.08);
    --font: 'Outfit', system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .contact-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6rem 2rem 4rem;
  }
  .contact-inner {
    max-width: 520px;
    width: 100%;
  }
  .section-label {
    font-family: var(--mono);
    font-size: 0.62rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--faint);
    margin-bottom: 0.25rem;
  }
  .section-title {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.2;
    margin-bottom: 1.5rem;
  }
  .contact-text {
    font-size: 0.92rem;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.8;
    margin-bottom: 2rem;
  }
  .contact-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.75rem;
    text-decoration: none;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 1.25rem;
    transition: all 0.2s;
  }
  .contact-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
  }
  .contact-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    background: var(--accent-soft);
    color: var(--accent);
    flex-shrink: 0;
  }
  .contact-card-body h2 {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 0.2rem;
  }
  .contact-card-body p {
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 300;
  }
  .contact-card + .contact-card {
    margin-top: 1rem;
  }
  .footer {
    text-align: center;
    padding: 2rem;
    font-size: 0.75rem;
    color: var(--faint);
    font-weight: 300;
    background: var(--surface);
  }
</style>
</head>
<body>
<script src="shared-nav.js"></script>

<div class="contact-screen">
  <div class="contact-inner">
    <div class="section-label">Get in touch</div>
    <div class="section-title">Contact</div>
    <p class="contact-text">Have a question, feedback, or just want to say hi? Feel free to reach out — I'd love to hear from you.</p>
    <a class="contact-card" href="mailto:orlandobsilva@outlook.com">
      <div class="contact-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25H4.5a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5H4.5a2.25 2.25 0 00-2.25 2.25m19.5 0l-9.75 6.5-9.75-6.5"/></svg></div>
      <div class="contact-card-body">
        <h2>Send me an email</h2>
        <p>orlandobsilva@outlook.com</p>
      </div>
    </a>
    <a class="contact-card" href="https://www.linkedin.com/in/orlandobsilva" target="_blank" rel="noopener">
      <div class="contact-icon"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></div>
      <div class="contact-card-body">
        <h2>LinkedIn</h2>
        <p>orlandobsilva</p>
      </div>
    </a>
  </div>
</div>

<div class="footer">Road Home &mdash; Game design project &mdash; March 2026</div>
</body>
</html>
